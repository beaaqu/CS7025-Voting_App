<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This or That — Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-left">
      <div class="auth-left-inner">
        <div class="brand-mark">THIS OR THAT</div>
        <h1 class="auth-display">Create your account</h1>
        <p class="auth-lead">
          Join the community and start making decisions easier.
        </p>

        <div class="auth-mini-card">
          <div class="auth-mini-dot"></div>
          <p>You can personalise your feed after sign up.</p>
        </div>
      </div>
    </section>

    <section class="auth-right">
      <div class="auth-card-v2">
        <div class="auth-card-icon">+</div>
        <h2>Create account</h2>
        <p class="auth-card-text">
          Set up your details and continue to the home feed.
        </p>

        <div class="auth-field">
          <label for="new-username">Username</label>
          <input id="new-username" type="text" placeholder="Choose a username" />
        </div>

        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email" />
        </div>

        <div class="auth-field">
          <label for="new-password">Password</label>
          <input id="new-password" type="password" placeholder="Create a password" />
        </div>

        <div class="auth-field">
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Confirm your password" />
        </div>

        <button type="button" class="auth-primary-btn" id="registerBtn">
          Create Account
        </button>

        <button type="button" class="auth-secondary-btn" onclick="window.location.href='login.html'">
          Back to Login
        </button>
      </div>
    </section>
  </main>

<script>
document.getElementById("registerBtn").addEventListener("click", () => {
  const username = document.getElementById("new-username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("new-password").value;
  const confirm = document.getElementById("confirm-password").value;

  if (!username || !email || !password) {
    alert("Fill all fields");
    return;
  }

  if (password !== confirm) {
    alert("Passwords do not match");
    return;
  }

  const users = JSON.parse(localStorage.getItem("users") || "[]");

  if (users.find(u => u.username === username)) {
    alert("Username already exists");
     return;
  }

  const newUser = {
    id: Date.now(),
    username,
    email,
    password
  };

  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(newUser));

  alert("Account created!");
  window.location.href = "home.html";
  });
  </script>

</body>
</html>
